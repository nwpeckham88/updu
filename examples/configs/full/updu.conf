# updu sample configuration
# Broad example covering every built-in monitor type.
# Uses public endpoints where practical; push monitors remain placeholders
# that you should replace before using in production.
# Smaller scenario-based examples live under examples/configs/.
# Prefer environment variables for secrets such as auth_secret.

host: 0.0.0.0
port: 3000
base_url: https://status.example.com
db_path: ./data/updu.db
log_level: info
session_ttl_days: 7
password_policy: strong
worker_pool_size: 8
min_interval_s: 30
enable_custom_css: false
trusted_proxy_cidrs:
  - 10.0.0.0/8
  - 192.168.0.0/16

monitors:
  - id: public-homepage
    name: Public Homepage
    type: http
    groups: [Web]
    tags: [prod, public]
    interval: 1m
    timeout: 10s
    retries: 1
    config:
      url: https://example.com
      method: GET
      expected_status: 200
      expected_body: Example Domain
      warn_days: 14

  - id: public-tcp-port
    name: GitHub HTTPS Port
    type: tcp
    groups: [Edge]
    interval: 2m
    config:
      host: github.com
      port: 443

  - id: public-anycast-ping
    name: Public Anycast Ping
    type: ping
    groups: [Network]
    interval: 1m
    config:
      host: 1.1.1.1
      count: 3

  - id: authoritative-dns
    name: Authoritative DNS
    type: dns
    groups: [Network]
    interval: 5m
    config:
      host: example.com
      record_type: A
      resolver: 1.1.1.1

  - id: nightly-backup-heartbeat
    name: Nightly Backup Heartbeat
    type: push
    groups: [Jobs]
    interval: 24h
    config:
      token: nightly-backup-heartbeat-token
