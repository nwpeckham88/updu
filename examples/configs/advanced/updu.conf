# Advanced monitor example covering multiple probe configurations.
# Uses public endpoints where practical so you can try it quickly before
# swapping in your own routing checks and services.

host: 0.0.0.0
port: 3000
base_url: https://status.example.com
log_level: info

monitors:
  - id: frontend-http
    name: Example HTTP
    type: http
    groups: [Edge]
    interval: 30s
    config:
      url: https://example.com
      expected_status: 200
      expected_body: Example Domain
      warn_days: 14

  - id: api-endpoint
    name: GitHub API Root
    type: http
    groups: [API]
    interval: 30s
    config:
      url: https://api.github.com
      expected_status: 200

  - id: edge-dns
    name: Edge DNS
    type: dns
    groups: [Network]
    interval: 5m
    config:
      host: example.com
      record_type: A
      resolver: 1.1.1.1

  - id: edge-tcp
    name: Edge TCP Port
    type: tcp
    groups: [Edge]
    interval: 2m
    config:
      host: github.com
      port: 443