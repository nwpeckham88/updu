# updu Gateway Stack Configuration
#
# This configuration demonstrates monitoring gateway architecture,
# including edge proxies, DNS resolution, and TCP reachability.

host: 0.0.0.0
port: 3000
log_level: info

monitors:
  - id: edge-load-balancer-http
    name: Edge Load Balancer (HTTP)
    type: http
    groups: [Edge]
    interval: 1m
    config:
      url: http://lb.internal.example/healthz
      expected_status: 200

  - id: edge-tcp-port
    name: Edge TCP Port
    type: tcp
    groups: [Edge]
    interval: 12h
    config:
      host: api.example.com
      port: 443

  - id: dns-resolution-gateway
    name: Gateway DNS Resolution
    type: dns
    groups: [Edge]
    interval: 5m
    config:
      host: api.example.com
      record_type: A
      resolver: 1.1.1.1

  - id: edge-gateway-ping
    name: Edge Gateway Ping
    type: ping
    groups: [Edge]
    interval: 1m
    config:
      host: 1.1.1.1
      count: 3
